---
layout: default
---
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="shortcut icon" href="{{ '/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <header class="hero">
      <nav class="nav" aria-label="Principal">
        <a class="brand" href="#">Lista de Filmes</a>
        <a class="imdb-link" href="https://www.imdb.com/pt/user/p.h4s3eq5kbbegjjzreimvc53mki/watchlist" target="_blank" rel="noreferrer">Ver watchlist no IMDb</a>
      </nav>
      <div class="hero-copy">
        <h1>Meus Filmes Favoritos</h1>
      </div>
      <div class="hero-meta">
        <span id="movie-count">0 filmes</span>
        <span>Ordenado por ano e nota IMDb</span>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Filtros da lista">
        <label class="search">
          <span class="sr-only">Buscar filmes</span>
          <input id="search" type="search" placeholder="Buscar por título ou elenco">
        </label>
        <label>
          <span class="sr-only">Filtrar por gênero</span>
          <select id="genre-filter">
            <option value="">Todos os gêneros</option>
          </select>
        </label>
        <label>
          <span class="sr-only">Filtrar por plataforma</span>
          <select id="platform-filter">
            <option value="">Todas as plataformas</option>
          </select>
        </label>
      </section>
      <section id="movie-list" class="movie-list" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>Nenhum filme encontrado.</p>
    </main>

    <footer>
      <p>Última atualização: 01/11/2026</p>
    </footer>

    <script src="movies.js"></script>
    <script src="app.js"></script>
