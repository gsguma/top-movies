<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Minha seleção de filmes, organizada por ano e nota do IMDb.">
    <title>Minha Lista de Filmes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="hero">
      <nav class="nav" aria-label="Principal">
        <a class="brand" href="#">TOP MOVIES</a>
        <a class="imdb-link" href="https://www.imdb.com/pt/user/p.h4s3eq5kbbegjjzreimvc53mki/watchlist" target="_blank" rel="noreferrer">Ver watchlist no IMDb</a>
      </nav>
      <div class="hero-copy">
        <p class="eyebrow">MINHA COLEÇÃO</p>
        <h1>Filmes para assistir<br><em>e guardar.</em></h1>
        <p>Uma seleção organizada pela história: dos primeiros aos melhores.</p>
      </div>
      <div class="hero-meta">
        <span id="movie-count">0 filmes</span>
        <span>Ordenado por ano e nota IMDb</span>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Filtros da lista">
        <label class="search">
          <span class="sr-only">Buscar filmes</span>
          <input id="search" type="search" placeholder="Buscar por título ou elenco">
        </label>
        <label>
          <span class="sr-only">Filtrar por gênero</span>
          <select id="genre-filter">
            <option value="">Todos os gêneros</option>
          </select>
        </label>
      </section>
      <section id="movie-list" class="movie-list" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>Nenhum filme encontrado.</p>
    </main>

    <footer>
      <p>Dados de catálogo e disponibilidade podem mudar.</p>
      <a href="PROMPT-ATUALIZAR-LISTA.md">Como atualizar esta lista</a>
    </footer>

    <script src="movies.js"></script>
    <script src="app.js"></script>
  </body>
</html>
